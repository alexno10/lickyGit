[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lickygit"
version = "1.1.0"
description = "Lick every secret out of your Git history — a modern, cross-platform Git secret scanner."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "lickyGit contributors" }]
keywords = ["git", "security", "secrets", "scanner", "leaks", "credentials"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "gitpython>=3.1",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.4",
]
yaml = ["pyyaml>=6.0"]

[project.scripts]
lickygit = "lickygit.cli:main"

[project.urls]
Homepage = "https://github.com/alexno10/lickyGit"
Repository = "https://github.com/alexno10/lickyGit"
Issues = "https://github.com/alexno10/lickyGit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lickygit"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

